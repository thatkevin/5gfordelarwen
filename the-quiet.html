<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>&#160;</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dark.css?v=7">
<script src="gate.js?v=7"></script>
<script src="drone.js?v=7"></script>
<style type="text/css">
  body{ background:#000 !important; color:#5a6a5a; }
  body::before{ opacity:0.5; }
  .q{ max-width:600px; margin:0 auto; padding:16vh 20px; text-align:center; }
  .cursor{ display:inline-block; width:10px; height:20px; background:#3a5a3a; vertical-align:middle; animation:cb 1.1s steps(2,start) infinite; }
  @keyframes cb{ to{ opacity:0; } }
  .q p{ line-height:2.2; }
  .q a{ color:#243824; border:0; }
  .q a:hover{ color:#4a6a4a; }
  #whisper{ min-height:2.4em; }
</style>
</head>
<body>
<div class="q">

  <p class="tiny" style="letter-spacing:6px;">&#8226; &#8226; &#8226;</p>

  <p id="whisper"></p>

  <p style="margin-top:8vh;">&#160;<span class="cursor"></span></p>

  <p class="tiny" style="margin-top:16vh;">
    there is nothing beneath this. this is the bottom of the quiet.<br>
    <a href="index.html">&#8617; there is a way back up, if you want it</a>
  </p>

  <p style="margin-top:18vh;text-align:center;">
    <a href="free-up-lewis.html" style="color:#7fae7f;border:1px solid #2f4f2f;padding:8px 16px;font-family:monospace;font-size:13px;letter-spacing:2px;text-shadow:0 0 6px rgba(120,200,120,0.4);"
       onmouseover="this.style.color='#c7e7c7'" onmouseout="this.style.color='#7fae7f'">&#9654; but lewis is still down here, and he brought a game &#9664;</a>
  </p>

</div>

<script>
var LINES=[
  "you kept clicking.",
  "most people stop before here.",
  "you are further down than the towers, further down than the corp,",
  "further down than the walks and the drifting caravans.",
  "you are in the quiet now. the real one. the one they sell.",
  "",
  "it is not so bad, is it.",
  "no notifications. no bars. no one can reach you.",
  "",
  "this is what dalarwen has, right now, for free.",
  "this is the thing the whole loud website is trying to give away.",
  "",
  "funny, isn't it. you came down here to find the darkness.",
  "you were standing in it the entire time."
];
(function(){
  var el=document.getElementById("whisper"), li=0, ci=0;
  function step(){
    if(li>=LINES.length){ return; }
    var line=LINES[li];
    if(line===""){ el.innerHTML+="<br><br>"; li++; ci=0; setTimeout(step,700); return; }
    el.innerHTML += line.charAt(ci); ci++;
    if(ci>=line.length){ el.innerHTML+="<br>"; li++; ci=0; setTimeout(step,900); }
    else setTimeout(step, 34+Math.random()*46);
  }
  setTimeout(step,900);
})();
</script>
</body>
</html>
