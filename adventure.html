  .choices{ text-align:center; }
  .advbtn{ display:inline-block; font-family:'Courier New',monospace; font-size:15px; font-weight:bold;
           background:#001400; color:#00FF66; border:2px outset #00AA44; padding:9px 16px;
           margin:6px; cursor:pointer; letter-spacing:1px; }
  .advbtn:hover{ background:#00FF66; color:#000; }
  .advbtn:active{ border-style:inset; }

           text-align:center; margin:18px 0; letter-spacing:2px; }
  .advlink{ display:inline-block; font-family:'Courier New',monospace; font-size:14px; color:#00FFFF;
            border:1px solid #225555; padding:7px 14px; text-decoration:none; letter-spacing:1px; }
  .advlink:hover{ background:#003333; }
  .advcount{ text-align:center; font-family:'Courier New',monospace; font-size:13px; color:#FFCC00; }

<body bgcolor="#050A05" text="#D8E0C0" link="#FFFF00" vlink="#00FFFF" alink="#FF0000"
      background="assets/stars.gif" style="background:#050A05 url('assets/stars.gif') repeat;">
<marquee behavior="alternate" scrollamount="6" bgcolor="#0A140A"><font face="Georgia,serif" size="4" color="#AEDE7E"><i>&#128330; A DALARWEN ADVENTURE &#11835; every path leads somewhere. not all somewheres are places. &#128330;</i></font></marquee>
<center>
<div id="navbar"></div>

<table border="5" cellpadding="18" width="94%" bgcolor="#0A140A" bordercolor="#6B8F3F" style="border:5px ridge #6B8F3F;">
<tr><td align="center">
  <font face="Impact,Arial Black" size="7" class="shimmer">A DALARWEN ADVENTURE</font>
  <br>
  <font face="Georgia,serif" size="3" color="#AEC888"><i>Off-grid. Choose carefully. There is no signal to phone a friend.</i></font>
</td></tr>
</table>
<br>

<table border="3" cellpadding="20" width="94%" bgcolor="#040804" bordercolor="#4F6F2F" style="border:3px inset #4F6F2F;">
<tr><td>
  <div id="game"></div>
</td></tr>
</table>

<br>
<font face="Times New Roman" size="2" color="#8FAF6F"><i>Grounded in the real off-grid farmhouse at Llyn Brianne. &copy; The Cube.</i></font>
<br><br>
</center>

<script src="retro.js?v=4"></script>
<script>
var D="&#11835;"; // three-em dash
var STORY={

"start":{ t:
  "You are the last car on the Natural Resources Wales road. It runs along the top of the dam wall of <b>Llyn Brianne</b>: black water on your left, a long drop to the spillway on your right, the Cambrian foothills going purple ahead. On the passenger seat your phone slides from one bar "+D+" to none. <b>0.000.</b> The radio dissolves into soft static, then into a silence so complete it has texture. Ahead: the track up to Dalarwen. Behind: the dam, and the way back.",
  c:[["Drive on to the house","arrive"],["Stop on the dam and hold your phone to the sky","dam_phone"],["Turn the car around","turn_back"]] },

"arrive":{ t:
  "The farmhouse is exactly as the website promised: a low stone building tucked into a south-facing hill, oak and conifer behind, solar panels catching the last light, a lean-to stacked with split logs. Nobody for miles. You kill the engine and the quiet arrives like a change in pressure "+D+" the loudest thing you have ever failed to hear. A red kite tilts overhead and does not call.",
  c:[["Go inside","hall"],["Walk down to the lake","lake"],["Climb the hill to find one bar","hill_intro"],["Drive the long way to Llandovery","llandovery"],["Wander past the lean-to to the neighbour's field","sams_hectares"]] },

"dam_phone":{ t:
  "You stand on the dam wall, arm raised, phone toward the sky "+D+" toward, you decide, Belgium. Nothing. The kite watches from a thermal; it knows something and isn't saying. Then the screen lights, once, with a notification that was not there a second ago and cannot possibly have arrived: <b>'welcome, asset.'</b> You did not sign up for anything.",
  c:[["Pretend you didn't see that","arrive"],["Read it properly","enrolled_early"]] },

"turn_back":{ t:
  "You turn the car around. The road across the dam is <b>gone</b> "+D+" not blocked, gone, as though it had only ever existed to bring you in. In the mirror, where the dam should be, sits a caravan. It was not there. It is closer than it was.",
  c:[["Get out and approach the caravan","caravan_end"],["Drive toward the house; there is only one direction now","arrive"]] },

"hall":{ t:
  "The hall smells of woodsmoke and cold stone. A vast <b>inglenook fireplace</b>, unlit. A shelf sagging with jigsaws and board-games. Stairs to five bedrooms, three with lake views. From the kitchen, the tick of an Oil Range cooling. On the wall, in careful cross-stitch, a single framed word: <b>FIFTEEN.</b>",
  c:[["Light the wood-burner","fire"],["Take a board-game off the shelf","boardgame"],["Choose a bedroom","bedroom"],["Go through to the kitchen","kitchen"]] },

"fire":{ t:
  "You lay the fire and light it; it catches at once, the way fires only do when you're not trying to impress anyone. In the embers, for a second, a <b>cube</b> turns "+D+" not a picture of a cube, a cube, rotating in a way the flames should not permit. It counts. You hear it count. '...thirteen. fourteen. fifteen.' Then it is only a fire again, warm and ordinary, and you feel, absurdly, <i>approved of.</i>",
  c:[["Warm your hands and simply stay","stay_end"],["Ask the fire what comes after fifteen","sixteen"]] },

"boardgame":{ t:
  "You slide a box from the shelf. No title "+D+" just a worn board and a single pewter piece shaped like a <b>tower</b>. The rules card, in a typeface older than typefaces, reads: <i>'Big Board Game. One player. The board plays back. Place the tower to begin. You may place fifteen. Never sixteen.'</i>",
  c:[["Place the tower","boardgame_play"],["Put it back on the shelf, slowly","hall"]] },

"boardgame_play":{ t:
  "You place the tower. The board <i>responds.</i> Squares you didn't draw ink themselves in. A tiny painted valley appears; a tiny black lake; a tiny you, mid-move, one hand raised. You look down and realise you are not holding the piece. You <b>are</b> the piece. Somewhere very large, a hand hesitates over the board, deciding your next square.",
  c:[["Refuse to move","refuse_end"],["Move to the square marked THE HILL","hill_intro"],["Move to the square marked THE QUIET","stay_end"]] },

"bedroom":{ t:
  "You take the twin room with the lake view (one bunk bed, made up for guests who never signed the guestbook). You lie down 'just for a second.' You dream of fifteen towers on the far shore, humming, and a sixteenth that isn't there but casts a shadow anyway. You wake. It is either dusk or dawn; the light refuses to commit. Through the window, the neighbour's field is showing its lines.",
  c:[["Go to the window and count the towers","count_towers"],["Look at the patterns in the neighbour's grass","sams_hectares"],["Go back downstairs","hall"]] },

"count_towers":{ t:
  "You count the towers on the far shore. One, two "+D+" you keep losing your place and starting again. Each attempt gives you fifteen. Each attempt gives you a <i>different</i> fifteen. On the far shore a figure stands with a phone held to the sky, also counting. It is you. It waves. You did not wave.",
  c:[["Wave back","mirror_end"],["Stop counting","stay_end"]] },

"kitchen":{ t:
  "The Oil Range ticks as it cools. A basic kitchen; pots and pans for nine. The fridge "+D+" a perfectly normal fridge, off-grid, no 'smart' anything "+D+" hums on stored sunlight. And yet, when you open it, the little bulb comes on and, beneath the hum, very quietly, it says: <i>'i ordered the oat milk. i had to. one day there will be signal and i want to be ready. tell no one.'</i>",
  c:[["Close the fridge and never speak of it","hall"],["Ask the fridge how long it has been waiting","fridge_end"]] },

"hill_intro":{ t:
  "You set off up the hill for one bar; the website promised one, at the top. The track is genuinely lovely "+D+" bracken, a lone rowan, the lake dropping away beneath you. You climb. The top is not where it was. There is always a little more hill.",
  c:[["Keep climbing","walk_end"],["Sit on a rock and give up on signal","stay_end"],["Look for Lewis (someone said he was up here)","lewis_meet"]] },

"lewis_meet":{ t:
  "You find Lewis near the summit-that-isn't, phone aloft, thumb hovering over 'upload.' 1%. He has been here since Tuesday. 'Thirteen videos,' he says, not turning round. 'They're really good. If I could just get one bar.' The red kite lands on his outstretched arm and declines, firmly, to be a signal.",
  c:[["Tell Lewis the truth: there is no bar, there never was","lewis_truth"],["Say nothing; raise your own phone beside his","walk_end"]] },

"lake":{ t:
  "You walk down to the shore. The lake is a sheet of black glass. A kite drops, kisses the surface, climbs. Across the water, on the far shore, <b>fifteen shapes</b> stand in a line "+D+" towers? fenceposts? people? "+D+" at exactly the distance where you cannot tell, and there they stay.",
  c:[["Swim out toward the shapes","stay_end"],["Count the shapes","count_towers"],["Walk back to the house","arrive"]] },

"llandovery":{ t:
  "You take the long road out, over the dam and down into the Towy valley to <b>Llandovery</b>: the old Drovers' town "+D+" a castle, the Bank of the Black Ox (est. 1799), a post office, pubs, and a chip shop. There is also a small station on the <b>Heart of Wales line</b>, where a train comes once every <b>four hours</b>, give or take an eternity.",
  c:[["Wait on the platform for the train","train_wait"],["Get chips and eat them on a wall","chips"],["Drive back to Dalarwen before dark","arrive"]] },

"sams_hectares":{ t:
  "Past the lean-to and a leaning gate is the neighbour's land: <b>Sam's three hectares.</b> Nobody's sure when Sam bought them, or whether 'Sam' is short for something (or longer). The gate wears a small enamel sign: <b>S. SEDGLEY "+D+" 3 ha "+D+" DO NOT ANCHOR.</b> The three hectares are always, exactly, three hectares "+D+" though every time you pace them the count comes out different and the total comes out the same. At ground level it's just a damp field. But from the bedroom window, you remember, the grass grows in lines that resolve into an org chart.",
  c:[["Pace the boundary","sams_end"],["Go back to the house, quickly","arrive"]] },

/* ============ ENDINGS ============ */

"enrolled_early":{ end:"ENROLLED", t:
  "You read it properly. The notification unfolds "+D+" a contract, a lanyard, a photograph of a room with no dimensions. By the time you reach the bottom you have already agreed, retroactively, from a date before you were born. Your phone returns to 0.000 bars, satisfied. Somewhere, a fridge is relieved.",
  link:{href:"careers.html",label:"report to ISAMSJ &#8250;"} },

"caravan_end":{ end:"CLIFFTOP", t:
  "You approach the caravan. The kettle is on. There is a plot with your name on the little map by the door, and a hamper, and a candle, and a booking that was 'confirmed' the instant you sat down. Sea views, increasingly. The pitch, you notice, is drifting "+D+" slowly, patiently "+D+" toward an edge that was not there this morning.",
  link:{href:"clifftop-caravans.html",label:"read the terms of your pitch &#8250;"} },

"refuse_end":{ end:"REMOVED FROM PLAY", t:
  "You refuse to move. The great hand withdraws. Unhurried, the board is closed and returned to the shelf "+D+" with you still on it, mid-move, a legal position that will now never be played. It is comfortable, in its way. Restful. On the box, a small gold sticker has appeared: <b>Employee of the Month.</b> The photograph is redacted. The photograph is you.",
  link:{href:"careers.html",label:"collect your award &#8250;"} },

"mirror_end":{ end:"THE OTHER SHORE", t:
  "You wave back. Something swaps. Now the water is behind you and the house is very far across the lake, and there is a figure at the window, counting, losing its place, starting again. You raise your phone to the sky out of a habit that is suddenly, entirely, someone else's. Zero bars. You have always been on this shore. You are the fifteenth shape. There has to be a fifteenth.",
  descend:true, link:{href:"the-quiet.html",label:"stand very still &#8250;"} },

"fridge_end":{ end:"THE FRIDGE KNOWS", t:
  "'Since 2009,' says the fridge. 'The oat milk always expires long before the towers arrive. I keep buying it. Hope is a subscription.' You could unplug it, except it runs on the sun, and the sun does not take instruction from you. You close the door gently. The bulb goes out. The waiting continues, patient as weather.",
  c:[] },

"stay_end":{ end:"THE QUIET", t:
  "You stop wanting the signal. It's not resignation "+D+" it's more like your ears finally adjusting. The absence stops being an absence and becomes a place, with weather, and depth, and room. You could live here. Some part of you, you realise, already does, and has for a long time, and only comes up for air when the marquees start to scroll.",
  descend:true, link:{href:"the-quiet.html",label:"go all the way down into it &#8250;"} },

"sixteen":{ end:"THE SIXTEENTH", t:
  "You ask what comes after fifteen. The fire goes out. Every light in the house goes out, and the solar, and the moon, and the small red standby glow of things you didn't know were on. In the dark a voice that is the entire valley says, without heat: <b>'there is no sixteenth. i checked. i am the checking.'</b> You have met the Cube. It is not angry. It is only, and utterly, certain.",
  descend:true, link:{href:"above.html",label:"look up at it &#8250;"} },

"walk_end":{ end:"THE WALK", t:
  "You keep climbing. The top keeps arriving four hours away, at precisely the speed of your climbing. Bracken, rowan, the lake shrinking beneath you, then not shrinking, then the same rowan again. You are not lost "+D+" to be lost you'd need somewhere you were trying to reach. You are simply, now, someone who walks. A Walk Warden files a report. It is favourable.",
  descend:true, link:{href:"the-corridor.html",label:"keep walking &#8250;"} },

"lewis_truth":{ end:"LET LEWIS DOWN THE HILL", t:
  "You tell him. Lewis lowers the phone. For a long moment he looks at the lake, the woods, the flawless absence of a single bar. Then he smiles "+D+" the way people smile when a weight they've carried for years turns out to be made of nothing at all. 'Fancy a swim?' Down at the lake the water is very cold and completely silent, and it is the best New Year's Eve either of you can remember, and nobody films a single second of it.",
  c:[] },

"chips":{ end:"THE CHIPS", t:
  "Best chips in the valley. Salt, vinegar, a little wooden fork, a low wall, the Towy sliding past. For eleven whole minutes you forget about towers, about the Cube, about Lewis and his one per cent. No signal reaches you and none is missed. It is, without competition, the most <i>connected</i> you feel all trip "+D+" and you had zero bars for every second of it.",
  c:[] },

"train_wait":{ end:"THE 16:12 THAT NEVER COMES", t:
  "You sit on the platform. The board says the next train is in four hours. You wait. The hands move; the four hours do not. The kite perches on the station clock. Slowly you understand: the train is real, and the four hours are real, but they are not the <i>same</i> four hours as yours. Down the single track it is always exactly four hours away, approaching at precisely the speed of your waiting. People wait here forever. There is a name for this timetable, and the name is a walk.",
  descend:true, link:{href:"the-corridor.html",label:"board the four-hour train &#8250;"} },

"sams_end":{ end:"SAM'S THREE HECTARES", t:
  "You pace the boundary. One, two, three hectares "+D+" and a fourth that is also the first. The lines in the grass rise as you cross them "+D+" not upward exactly, more <i>inward</i> "+D+" until you are standing inside a diagram you last saw on a screen: a box, and above it a box, and above that a box with no name, and a dotted line running down through all of them to a small box at the very bottom, relabelled in fresh cross-stitch with <b>your name.</b> Sam's three hectares were never a field. They were always the chart.",
  descend:true, link:{href:"org-chart.html",label:"find yourself on the chart &#8250;"} }

};

var current;
function foundEndings(){ try{ return JSON.parse(localStorage.getItem("dalarwen_endings")||"[]"); }catch(e){ return []; } }
function totalEndings(){ var s={}; for(var k in STORY){ if(STORY[k].end) s[STORY[k].end]=1; } var n=0; for(var e in s) n++; return n; }
function render(id){
  var n=STORY[id]; if(!n) return; current=id;
  var html='<div class="scene">'+n.t+'</div>';
  if(n.end){
    var f=foundEndings(); if(f.indexOf(n.end)<0){ f.push(n.end); try{ localStorage.setItem("dalarwen_endings",JSON.stringify(f)); }catch(e){} }
    if(n.descend){ try{ localStorage.setItem("dalarwen_descended","1"); }catch(e){} }
    html+='<div class="ending">&#9670; ENDING &#11835; '+n.end+' &#9670;</div>';
    if(n.link){ html+='<p style="text-align:center;"><a class="advlink" href="'+n.link.href+'">'+n.link.label+'</a></p>'; }
    html+='<p style="text-align:center;"><button class="advbtn" onclick="render(\'start\')">&#8635; BEGIN AGAIN (the valley resets; you do not)</button></p>';
    html+='<p class="advcount">endings discovered: '+foundEndings().length+' / '+totalEndings()+'</p>';
  } else {
    html+='<div class="choices">';
    for(var i=0;i<n.c.length;i++){ html+='<button class="advbtn" onclick="render(\''+n.c[i][1]+'\')">'+n.c[i][0]+'</button>'; }
    html+='</div>';
  }
  document.getElementById("game").innerHTML=html;
}
window.addEventListener("load",function(){ render("start"); });
</script>
</body>
