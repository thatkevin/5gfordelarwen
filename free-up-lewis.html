<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FREE UP LEWIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0618'/%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%93%B6%3C/text%3E%3C/svg%3E">
<script src="gate.js?v=7"></script>
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#0a0618;}
  #hint{position:fixed;left:8px;top:8px;z-index:5;font-family:monospace;font-size:11px;color:#2f5f2f;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">&#9668;&#9658; move &#8226; SPACE jump &#8226; R restart</div>
<script>
(function(){
"use strict";
var VW=960, VH=540;
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var scale=1, ox=0, oy=0;
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  scale=Math.max(1, Math.floor(Math.min(w/VW, h/VH)*100)/100);
  cv.width=VW; cv.height=VH;
  cv.style.width=(VW*scale)+"px"; cv.style.height=(VH*scale)+"px";
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener("resize",resize); resize();

/* ---------- seeded RNG ---------- */
var seed=1337; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }

/* ---------- input ---------- */
var K={left:false,right:false,jump:false};
function setKey(e,v){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){K.left=v;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){K.right=v;e.preventDefault();}
  else if(k===" "||k==="ArrowUp"||k==="w"||k==="W"){K.jump=v;e.preventDefault();}
  else if((k==="r"||k==="R")&&v){ if(state!=="play") startGame(); }
  else if(k==="Enter"&&v&&state!=="play"){ startGame(); }
}
window.addEventListener("keydown",function(e){ if(state==="title"&&(e.key===" "||e.key==="Enter")){startGame();return;} setKey(e,true); });
window.addEventListener("keyup",function(e){ setKey(e,false); });
/* touch: left third=left, right third=right, top area / tap=jump */
function touchHandler(e){
  K.left=K.right=K.jump=false;
  if(state!=="play"){ startGame(); return; }
  for(var i=0;i<e.touches.length;i++){
    var t=e.touches[i], x=t.clientX, y=t.clientY, W=window.innerWidth, H=window.innerHeight;
    if(y<H*0.45){ K.jump=true; }
    else if(x<W*0.5){ K.left=true; } else { K.right=true; }
  }
  e.preventDefault();
}
cv.addEventListener("touchstart",touchHandler,{passive:false});
cv.addEventListener("touchmove",touchHandler,{passive:false});
cv.addEventListener("touchend",function(e){ K.left=K.right=K.jump=false; e.preventDefault(); },{passive:false});

/* ---------- tiny SFX ---------- */
var actx=null;
function beep(f,d,t){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.type=t||"square"; o.frequency.value=f; g.gain.value=0.05; o.connect(g); g.connect(actx.destination); var n=actx.currentTime; o.start(n); g.gain.setValueAtTime(0.05,n); g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.1)); o.stop(n+(d||0.1)); }catch(e){} }

/* ---------- world ---------- */
var G=0.9, worldW, plats, towers, uploads, sheep, neil, player, cam, rain, state, hearts, builtCount, upCount, msg, msgT, win;

function buildLevel(){
  seed=1337;
  plats=[]; towers=[]; uploads=[]; sheep=[];
  // cottage platform
  plats.push({x:0,w:380,y:430,cottage:true});
  var x=380, prevY=430;
  while(x<3500){
    var gap=68+rnd()*46;              // jumpable gaps
    x+=gap;
    var w=200+rnd()*150;
    var y=430;
    var r=rnd();
    if(r<0.28) y=prevY-70-rnd()*30;
    else if(r<0.42) y=prevY+60;
    y=Math.max(250,Math.min(455,y));
    if(Math.abs(y-prevY)>100) y=prevY-90;   // keep reachable
    plats.push({x:x,w:w,y:y});
    prevY=y; x+=w;
  }
  // final wide platform (the grid + Neil + end)
  plats.push({x:x+90,w:520,y:430,end:true});
  worldW=x+90+520;

  // walkable top segments for item placement
  var segs=plats.map(function(p){ return {x0:p.x+18,x1:p.x+p.w-18,y:p.y}; });
  var L=0; segs.forEach(function(s){ L+=Math.max(0,s.x1-s.x0); });
  function atDist(d){ for(var i=0;i<segs.length;i++){ var len=segs[i].x1-segs[i].x0; if(d<=len) return {x:segs[i].x0+d,y:segs[i].y}; d-=len; } var s=segs[segs.length-1]; return {x:s.x1,y:s.y}; }

  for(var i=0;i<15;i++){ var p=atDist((i+0.5)/15*L); towers.push({x:p.x,y:p.y,built:false,blink:rnd()*6.28}); }
  for(var j=0;j<13;j++){ var q=atDist((j+0.35)/13*L); uploads.push({x:q.x+30,y:q.y-46,got:false,bob:rnd()*6.28}); }

  // sheep on wider platforms (skip cottage + a couple)
  for(var s2=2;s2<plats.length-1;s2++){
    var pl=plats[s2];
    if(pl.w>=230 && rnd()<0.8){
      sheep.push({x:pl.x+40,y:pl.y-30,w:44,h:30,minx:pl.x+16,maxx:pl.x+pl.w-60,dir:rnd()<0.5?-1:1,spd:0.8+rnd()*0.9,t:rnd()*6.28});
    }
  }
  // Neil the zombie on the final platform
  var last=plats[plats.length-1];
  neil={x:last.x+last.w-80,y:last.y-46,w:36,h:46,spd:1.15,active:false};
}

function resetPlayer(px,py){ player={x:px,y:py,w:22,h:34,vx:0,vy:0,onGround:false,face:1,inv:0,checkX:px,checkY:py}; }

function startGame(){
  buildLevel();
  resetPlayer(60,430-34);
  cam=0; hearts=3; builtCount=0; upCount=0; win=false; msg=""; msgT=0;
  rain=[]; for(var i=0;i<120;i++){ rain.push({x:rnd()*VW,y:rnd()*VH,l:10+rnd()*22,s:6+rnd()*8,c:rnd()<0.5?"#66ff88":"#a06bff"}); }
  state="play";
}

/* ---------- collision helpers ---------- */
function landOn(p){ // returns platform top y if player is landing on p this frame
  return null;
}

/* ---------- update ---------- */
function hurt(){
  if(player.inv>0) return;
  hearts--; player.inv=90; player.vy=-9; player.vx=player.face*-4; beep(120,0.25,"sawtooth");
  msg="OW! DI SHEEP!"; msgT=70;
  if(hearts<=0){ state="dead"; beep(80,0.5,"sawtooth"); }
}

function step(){
  if(state!=="play") return;
  // horizontal
  var acc=0.7, max=4.3;
  if(K.left){ player.vx-=acc; player.face=-1; }
  if(K.right){ player.vx+=acc; player.face=1; }
  if(!K.left&&!K.right){ player.vx*=0.8; }
  player.vx=Math.max(-max,Math.min(max,player.vx));
  // jump
  if(K.jump&&player.onGround){ player.vy=-15; player.onGround=false; beep(660,0.09); }
  // gravity
  player.vy+=G; if(player.vy>18) player.vy=18;

  player.x+=player.vx;
  if(player.x<0) player.x=0;
  if(player.x+player.w>worldW) player.x=worldW-player.w;

  // vertical + platform landing
  var py0=player.y;
  player.y+=player.vy;
  player.onGround=false;
  for(var i=0;i<plats.length;i++){
    var p=plats[i];
    if(player.x+player.w>p.x+4 && player.x<p.x+p.w-4){
      var top=p.y;
      if(py0+player.h<=top+2 && player.y+player.h>=top){ // crossed the top while falling
        player.y=top-player.h; player.vy=0; player.onGround=true;
        player.checkX=Math.min(Math.max(player.x,p.x+10),p.x+p.w-40); player.checkY=top-player.h;
      }
    }
  }
  // fell off the world / into the stream
  if(player.y>VH+40){ hearts--; beep(100,0.4,"sawtooth"); if(hearts<=0){ state="dead"; } else { resetPlayer(player.checkX,player.checkY-4); player.inv=60; } }

  if(player.inv>0) player.inv--;

  // camera
  cam=Math.max(0,Math.min(worldW-VW, player.x-VW*0.35));

  // towers: build on touch
  for(var t=0;t<towers.length;t++){
    var tw=towers[t]; if(tw.built) continue;
    if(player.x+player.w>tw.x-14 && player.x<tw.x+14 && player.y+player.h>tw.y-70 && player.y<tw.y+4){
      tw.built=true; builtCount++; beep(880,0.12); beep(1320,0.12);
      msg="TOWA "+builtCount+"/15 BUILT!"; msgT=60;
    }
  }
  // uploads
  for(var u=0;u<uploads.length;u++){
    var up=uploads[u]; if(up.got) continue; up.bob+=0.1;
    if(Math.abs((player.x+player.w/2)-up.x)<22 && Math.abs((player.y+player.h/2)-(up.y))<28){
      up.got=true; upCount++; beep(1046,0.1); beep(1568,0.12);
      msg="UPLOAD "+upCount+"/13 SENT!"; msgT=60;
    }
  }
  // sheep
  for(var s=0;s<sheep.length;s++){
    var sh=sheep[s]; sh.t+=0.2;
    sh.x+=sh.dir*sh.spd; if(sh.x<sh.minx){sh.x=sh.minx;sh.dir=1;} if(sh.x>sh.maxx){sh.x=sh.maxx;sh.dir=-1;}
    if(player.x+player.w>sh.x+4 && player.x<sh.x+sh.w-4 && player.y+player.h>sh.y+2 && player.y<sh.y+sh.h) hurt();
  }
  // neil
  if(neil){
    if(player.x>neil.x-VW*0.6) neil.active=true;
    if(neil.active){ neil.x+= (player.x>neil.x?1:-1)*neil.spd; neil.t=(neil.t||0)+0.15; }
    if(player.x+player.w>neil.x+4 && player.x<neil.x+neil.w-4 && player.y+player.h>neil.y && player.y<neil.y+neil.h) hurt();
  }

  // win
  if(builtCount>=15 && upCount>=13 && !win){ win=true; state="win"; beep(880,0.15); setTimeout(function(){beep(1175,0.15);},130); setTimeout(function(){beep(1568,0.3);},260); }

  // rain
  for(var r=0;r<rain.length;r++){ var d=rain[r]; d.y+=d.s; d.x-=1.5; if(d.y>VH){ d.y=-d.l; d.x=rnd()*VW; } if(d.x<0) d.x+=VW; }

  if(msgT>0) msgT--;
}

/* ---------- draw ---------- */
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function drawMountains(){
  // parallax silhouettes
  var p=cam*0.25;
  ctx.fillStyle="#160d2b";
  for(var i=-1;i<6;i++){ var bx=i*260-(p%260); ctx.beginPath(); ctx.moveTo(bx,300); ctx.lineTo(bx+130,150); ctx.lineTo(bx+260,300); ctx.closePath(); ctx.fill(); }
  var p2=cam*0.4;
  ctx.fillStyle="#20143a";
  for(var j=-1;j<7;j++){ var cx=j*200-(p2%200); ctx.beginPath(); ctx.moveTo(cx,340); ctx.lineTo(cx+100,210); ctx.lineTo(cx+200,340); ctx.closePath(); ctx.fill(); }
}
function drawTowerBig(x,y,label){
  x-=cam;
  if(x<-120||x>VW+120) return;
  rect(x-2,y-170,4,170,"#8a8a95"); rect(x-24,y-170,48,4,"#6a6a75");
  ctx.strokeStyle="#6a6a75"; ctx.lineWidth=2;
  for(var i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(x-20+i*0,y-i*20); ctx.lineTo(x+20,y-i*20-10); ctx.stroke(); }
  rect(x-16,y-120,32,20,"#123"); ctx.fillStyle="#39f"; ctx.font="bold 12px monospace"; ctx.textAlign="center"; ctx.fillText("5G",x,y-105);
  // red beacon
  rect(x-2,y-178,4,6, (Math.floor(Date.now()/400)%2)?"#f22":"#600");
  ctx.fillStyle="#fff"; ctx.fillRect(x-24,y-150,48,12); ctx.fillStyle="#000"; ctx.font="9px monospace"; ctx.fillText(label,x,y-141);
}
function drawPlatform(p){
  var x=p.x-cam;
  if(x>VW||x+p.w<0) return;
  rect(x,p.y,p.w,VH-p.y+40,"#140a05");      // soil
  rect(x,p.y,p.w,8,"#2f8a3a");               // grass
  rect(x,p.y,p.w,3,"#5fe06a");               // grass highlight
  // little tufts
  ctx.fillStyle="#3fbf4a";
  for(var g=0;g<p.w;g+=22){ ctx.fillRect(x+g,p.y-3,2,3); ctx.fillRect(x+g+6,p.y-4,2,4); }
  if(p.cottage) drawCottage(x+40,p.y);
  if(p.end){ // FIFTEEN TOWA THIS WAY sign + big towers behind handled elsewhere
    ctx.fillStyle="#3a2a12"; ctx.fillRect(x+p.w-120,p.y-46,110,30); ctx.fillStyle="#e8c060"; ctx.font="bold 10px monospace"; ctx.textAlign="center"; ctx.fillText("FIFTEEN TOWA",x+p.w-65,p.y-32); ctx.fillText("THIS WAY →",x+p.w-65,p.y-20); }
}
function drawCottage(x,y){
  rect(x,y-52,84,52,"#3a3550"); rect(x,y-52,84,4,"#4a4560");
  ctx.fillStyle="#241f38"; ctx.beginPath(); ctx.moveTo(x-6,y-52); ctx.lineTo(x+42,y-78); ctx.lineTo(x+90,y-52); ctx.closePath(); ctx.fill();
  rect(x+14,y-30,18,30,"#c98a2a"); rect(x+50,y-40,20,18,"#ffd33a"); // door + lit window
  rect(x+56,y-84,6,14,"#555"); // chimney
}
function drawTowerNode(tw){
  var x=tw.x-cam, y=tw.y;
  if(x<-40||x>VW+40) return;
  if(tw.built){
    rect(x-3,y-70,6,70,"#9aa"); rect(x-14,y-70,28,4,"#889");
    rect(x-12,y-58,24,16,"#134"); ctx.fillStyle="#4cf"; ctx.font="bold 11px monospace"; ctx.textAlign="center"; ctx.fillText("5G",x,y-45);
    rect(x-2,y-76,4,6,(Math.floor(Date.now()/300)%2)?"#f33":"#500");
    // signal pulse
    ctx.strokeStyle="rgba(90,255,120,0.5)"; ctx.lineWidth=2;
    var pr=(Date.now()/12%40); ctx.beginPath(); ctx.arc(x,y-70,pr,0,6.28); ctx.stroke();
  } else {
    tw.blink+=0.05;
    rect(x-2,y-44,4,44,"#556"); rect(x-10,y-44,20,3,"#445");
    // "build me" marker
    ctx.fillStyle=(Math.sin(tw.blink)>0)?"#ff0":"#880"; ctx.font="bold 10px monospace"; ctx.textAlign="center"; ctx.fillText("BUILD",x,y-52);
    ctx.strokeStyle="#664"; ctx.beginPath(); ctx.moveTo(x-9,y); ctx.lineTo(x,y-40); ctx.lineTo(x+9,y); ctx.stroke();
  }
}
function drawUpload(up){
  if(up.got) return; var x=up.x-cam, y=up.y+Math.sin(up.bob)*4;
  if(x<-30||x>VW+30) return;
  rect(x-7,y-11,14,22,"#111"); rect(x-5,y-9,10,14,"#7cf"); // phone with screen
  ctx.fillStyle="#0ff"; ctx.font="bold 8px monospace"; ctx.textAlign="center"; ctx.fillText("↑",x,y+2);
  ctx.strokeStyle="rgba(0,255,255,0.4)"; ctx.beginPath(); ctx.arc(x,y,16,0,6.28); ctx.stroke();
}
function drawSheep(sh){
  var x=sh.x-cam, y=sh.y;
  if(x<-60||x>VW+60) return;
  // lightning aura
  ctx.strokeStyle="rgba(90,200,255,"+(0.4+0.3*Math.sin(sh.t*3))+")"; ctx.lineWidth=1.5;
  for(var i=0;i<4;i++){ var a=sh.t+i*1.57; ctx.beginPath(); ctx.moveTo(x+22+Math.cos(a)*20,y+14+Math.sin(a)*14); ctx.lineTo(x+22+Math.cos(a)*30,y+14+Math.sin(a)*20); ctx.stroke(); }
  rect(x+6,y+22,5,8,"#222"); rect(x+30,y+22,5,8,"#222"); // legs
  ctx.fillStyle="#e8e8ee"; ctx.beginPath(); ctx.arc(x+22,y+14,16,0,6.28); ctx.fill(); // wool
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.arc(x+ (sh.dir<0?8:36), y+14,7,0,6.28); ctx.fill(); // head
  rect(x+(sh.dir<0?4:33),y+11,4,3,"#f22"); // red eye
}
function drawNeil(){
  if(!neil) return; var x=neil.x-cam,y=neil.y;
  if(x<-40||x>VW+40) return;
  ctx.fillStyle="#f33"; ctx.font="bold 10px monospace"; ctx.textAlign="center"; ctx.fillText("NEIL",x+18,y-6);
  rect(x+6,y+30,7,16,"#294a20"); rect(x+22,y+30,7,16,"#294a20");
  rect(x+4,y+8,28,26,"#3a6a2c"); rect(x+8,y-8,20,18,"#4a7a38"); // body head
  rect(x+11,y-2,4,4,"#f00"); rect(x+21,y-2,4,4,"#f00"); // eyes
  rect(x+2,y+12,6,4,"#3a6a2c"); rect(x+28,y+12,6,4,"#3a6a2c"); // arms out
}
function drawPlayer(){
  var x=player.x-cam,y=player.y;
  if(player.inv>0 && Math.floor(player.inv/6)%2) return; // blink when hurt
  rect(x+4,y+22,5,12,"#22314a"); rect(x+13,y+22,5,12,"#22314a"); // legs
  rect(x+2,y+8,18,16,"#2fa04a"); // green jacket
  rect(x+5,y-6,12,12,"#e8b98a"); // head
  rect(x+ (player.face>0?13:3),y-8,6,6,"#5a3a20"); // hair tuft
  // arm holding glowing phone
  var px=x+(player.face>0?20:-4);
  rect(px,y+2,4,3,"#e8b98a"); rect(px+(player.face>0?3:-3),y-6,4,8,"#111");
  ctx.fillStyle="rgba(120,255,150,0.7)"; ctx.beginPath(); ctx.arc(px+(player.face>0?5:-1),y-4,7,0,6.28); ctx.fill();
}
function bars(n){ return n; }
function drawHUD(){
  // top bar
  rect(0,0,VW,42,"#08120a"); ctx.strokeStyle="#39f04a"; ctx.lineWidth=3; ctx.strokeRect(3,3,VW-6,38);
  ctx.textAlign="left"; ctx.font="bold 20px monospace";
  ctx.fillStyle="#3cff5a"; ctx.fillText("LEWIS",16,28);
  ctx.fillStyle="#ff3b5b"; for(var i=0;i<3;i++){ ctx.fillText(i<hearts?"♥":"♡",96+i*24,28); }
  ctx.fillStyle="#3cff5a"; ctx.fillText("TOWA "+(builtCount<10?"0"+builtCount:builtCount)+"/15",320,28);
  var sig=Math.min(5,1+Math.floor(builtCount/3));
  ctx.fillStyle="#ffe14a"; ctx.fillText("SIGNAL "+sig+" BAR",540,28);
  for(var b=0;b<5;b++){ rect(710+b*9,26-b*3,6,4+b*3, b<sig?"#3cff5a":"#234"); }
  ctx.fillStyle="#3cff5a"; ctx.textAlign="right"; ctx.fillText("UPLOADS "+(upCount<10?"0"+upCount:upCount)+"/13",VW-16,28);
  // bottom bar
  rect(0,VH-30,VW,30,"#08120a"); ctx.strokeStyle="#39f04a"; ctx.strokeRect(3,VH-27,VW-6,24);
  ctx.textAlign="center"; ctx.font="bold 15px monospace"; ctx.fillStyle="#ffe14a";
  ctx.fillText("BUILD DI TOWA  ♦  DODGE DI SHEEP  ♦  FREE UP LEWIS",VW/2,VH-10);
  // transient message
  if(msgT>0){ ctx.textAlign="center"; ctx.font="bold 22px monospace"; ctx.fillStyle="#fff"; ctx.fillText(msg,VW/2,90); }
}
function drawScene(){
  // sky
  var g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#0c0722"); g.addColorStop(0.6,"#0a0618"); g.addColorStop(1,"#08040f");
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // moon
  ctx.fillStyle="#c9d0e8"; ctx.beginPath(); ctx.arc(150-cam*0.15,90,26,0,6.28); ctx.fill();
  ctx.fillStyle="#0a0618"; ctx.beginPath(); ctx.arc(162-cam*0.15,84,22,0,6.28); ctx.fill();
  drawMountains();
  // DALARWEN sky text
  ctx.fillStyle="rgba(90,180,110,0.5)"; ctx.textAlign="center"; ctx.font="bold 26px monospace"; ctx.fillText("DALARWEN",480-cam*0.3,150);
  // rain
  for(var r=0;r<rain.length;r++){ var d=rain[r]; ctx.strokeStyle=d.c; ctx.globalAlpha=0.5; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-3,d.y+d.l); ctx.stroke(); }
  ctx.globalAlpha=1;
  // big background towers near the end (scenery)
  var last=plats[plats.length-1];
  drawTowerBig(last.x-40,last.y-8,"TOWA 01"); drawTowerBig(last.x+150,last.y-8,"TOWA 02"); drawTowerBig(last.x+330,last.y-8,"TOWA 03");
  // platforms + items
  for(var i=0;i<plats.length;i++) drawPlatform(plats[i]);
  for(var t=0;t<towers.length;t++) drawTowerNode(towers[t]);
  for(var u=0;u<uploads.length;u++) drawUpload(uploads[u]);
  for(var s=0;s<sheep.length;s++) drawSheep(sheep[s]);
  drawNeil();
  drawPlayer();
  drawHUD();
}

/* ---------- screens ---------- */
function overlay(title,lines,col){
  ctx.fillStyle="rgba(4,3,15,0.82)"; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign="center";
  ctx.fillStyle=col||"#3cff5a"; ctx.font="bold 46px monospace"; ctx.fillText(title,VW/2,VH/2-40);
  ctx.fillStyle="#dfe"; ctx.font="16px monospace";
  for(var i=0;i<lines.length;i++) ctx.fillText(lines[i],VW/2,VH/2+6+i*26);
}
function drawTitle(){
  drawScene && ctx.fillStyle==ctx.fillStyle;
  ctx.fillStyle="#0a0618"; ctx.fillRect(0,0,VW,VH);
  // little scene behind
  var g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#0c0722"); g.addColorStop(1,"#08040f"); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#c9d0e8"; ctx.beginPath(); ctx.arc(150,90,26,0,6.28); ctx.fill(); ctx.fillStyle="#0a0618"; ctx.beginPath(); ctx.arc(162,84,22,0,6.28); ctx.fill();
  ctx.textAlign="center";
  ctx.fillStyle="#ffe14a"; ctx.font="bold 12px monospace"; ctx.fillText("A DALARWEN 5G LIBERATION FRONT PRODUCTION",VW/2,120);
  ctx.fillStyle="#3cff5a"; ctx.font="bold 58px monospace"; ctx.fillText("FREE UP LEWIS",VW/2,VH/2-10);
  ctx.fillStyle="#a06bff"; ctx.font="bold 20px monospace"; ctx.fillText("build di towa ♦ dodge di sheep ♦ zero bars forever",VW/2,VH/2+30);
  ctx.fillStyle="#fff"; ctx.font="16px monospace"; ctx.fillText("← → move   •   SPACE / ↑ jump   •   touch: sides move, top jumps",VW/2,VH/2+80);
  ctx.fillStyle=(Math.floor(Date.now()/500)%2)?"#fff":"#3cff5a"; ctx.font="bold 22px monospace"; ctx.fillText("PRESS SPACE / TAP TO START",VW/2,VH/2+130);
}

/* ---------- loop ---------- */
var acc=0, last=performance.now();
function frame(now){
  var dt=now-last; last=now; acc+=dt;
  var steps=0;
  while(acc>=1000/60 && steps<5){ step(); acc-=1000/60; steps++; }
  if(state==="title"){ drawTitle(); }
  else { drawScene();
    if(state==="dead") overlay("GAME OVER",["the sheep (and Neil) send their regards","press R or tap to try again"],"#ff3b5b");
    if(state==="win") overlay("LEWIS IS FREE",["15 towa built and 13 uploads sent","the valley streams... for now","press R or tap to play again"],"#3cff5a");
  }
  requestAnimationFrame(frame);
}
state="title"; buildLevel(); resetPlayer(60,396); cam=0; hearts=3; builtCount=0; upCount=0;
rain=[]; for(var i=0;i<120;i++){ rain.push({x:Math.random()*VW,y:Math.random()*VH,l:10+Math.random()*22,s:6+Math.random()*8,c:Math.random()<0.5?"#66ff88":"#a06bff"}); }
requestAnimationFrame(frame);
})();
</script>
