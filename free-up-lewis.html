<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FREE UP LEWIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0618'/%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%93%B6%3C/text%3E%3C/svg%3E">
<script src="gate.js?v=8"></script>
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#0a0618;}
  #hint{position:fixed;left:8px;top:8px;z-index:5;font-family:monospace;font-size:11px;color:#2f5f2f;}
  /* mobile on-screen controls */
  #pad{position:fixed;inset:0;z-index:6;pointer-events:none;}
  .pad{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:50%;
       font-family:monospace;font-weight:bold;pointer-events:auto;user-select:none;-webkit-user-select:none;
       -webkit-tap-highlight-color:transparent;touch-action:none;opacity:.55;}
  #bL,#bR{width:76px;height:76px;font-size:30px;background:rgba(8,24,12,.6);border:3px solid #3cff5a;color:#3cff5a;}
  #bL{left:calc(16px + env(safe-area-inset-left));}
  #bR{left:calc(104px + env(safe-area-inset-left));}
  #bJ{right:calc(18px + env(safe-area-inset-right));width:104px;height:104px;font-size:18px;
      background:rgba(24,8,20,.6);border:3px solid #ff3b5b;color:#ffd0d8;}
  .pad:active{opacity:.9;}
  #rotate{position:fixed;left:0;right:0;bottom:8px;z-index:7;text-align:center;color:#ffe14a;
          font-family:monospace;font-size:13px;pointer-events:none;display:none;text-shadow:0 0 4px #000;}
  @media (orientation:portrait){ #rotate{display:block;} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">&#9668;&#9658; move &#8226; SPACE jump &#8226; R restart</div>
<div id="pad" hidden>
  <button id="bL" class="pad" aria-label="left">&#9668;</button>
  <button id="bR" class="pad" aria-label="right">&#9658;</button>
  <button id="bJ" class="pad" aria-label="jump">JUMP</button>
</div>
<div id="rotate">&#8635; turn your phone sideways for the full valley</div>
<script>
(function(){
"use strict";
var VW=960, VH=540;
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var scale=1;
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  scale=Math.min(w/VW, h/VH);
  cv.width=VW; cv.height=VH;
  cv.style.width=Math.round(VW*scale)+"px"; cv.style.height=Math.round(VH*scale)+"px";
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){ setTimeout(resize,120); });
resize();

var seed=1337; function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
var TAU=6.2831853;

/* ---------- input ---------- */
var K={left:false,right:false,jump:false};
function setKey(e,v){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){K.left=v;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){K.right=v;e.preventDefault();}
  else if(k===" "||k==="ArrowUp"||k==="w"||k==="W"){K.jump=v;e.preventDefault();}
  else if((k==="r"||k==="R")&&v){ if(state!=="play") startGame(); }
  else if(k==="Enter"&&v&&state!=="play"){ startGame(); }
}
function poke(){ if(state==="win"){ winAdvance(); } else if(state!=="play"){ startGame(); } }
window.addEventListener("keydown",function(e){
  if(state==="title"&&(e.key===" "||e.key==="Enter")){startGame();return;}
  if(state==="win"){
    // only a FRESH press of Right/Enter advances (never a held key, esp. Space);
    if(!e.repeat && (e.key==="ArrowRight"||e.key==="Enter")){ winAdvance(); }
    if(e.key==="r"||e.key==="R"){ startGame(); }
    e.preventDefault(); return;   // swallow everything else (Space does nothing)
  }
  setKey(e,true);
});
window.addEventListener("keyup",function(e){ setKey(e,false); });

/* touch: tap canvas to start / advance; movement via the on-screen buttons */
function startTap(e){ poke(); e.preventDefault(); }
cv.addEventListener("touchstart",startTap,{passive:false});
cv.addEventListener("mousedown",function(e){ poke(); });

/* on-screen control buttons */
var touchCap = ("ontouchstart" in window) || (navigator.maxTouchPoints>0);
if(touchCap){ document.getElementById("pad").hidden=false; document.getElementById("hint").style.display="none"; }
function bindPad(id,setter){
  var el=document.getElementById(id);
  function down(e){ if(state!=="play"){ poke(); } setter(true); e.preventDefault(); }
  function up(e){ setter(false); e.preventDefault(); }
  el.addEventListener("touchstart",down,{passive:false});
  el.addEventListener("touchend",up,{passive:false});
  el.addEventListener("touchcancel",up,{passive:false});
  el.addEventListener("mousedown",down); el.addEventListener("mouseup",up); el.addEventListener("mouseleave",up);
}
bindPad("bL",function(v){K.left=v;});
bindPad("bR",function(v){K.right=v;});
bindPad("bJ",function(v){K.jump=v;});

/* ---------- SFX ---------- */
var actx=null;
function beep(f,d,t){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.type=t||"square"; o.frequency.value=f; g.gain.value=0.05; o.connect(g); g.connect(actx.destination); var n=actx.currentTime; o.start(n); g.gain.setValueAtTime(0.05,n); g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.1)); o.stop(n+(d||0.1)); }catch(e){} }

/* ---------- world ---------- */
var G=0.9, worldW, plats, towers, uploads, sheep, neil, bigTowers, props, bridge, streamPts;
var player, cam, rain, state, hearts, builtCount, upCount, msg, msgT, frozen, respawnT, tGlobal=0;

/* ---------- victory gallery (8-bit loading-screen slideshow) ---------- */
var WINSRC=["game-art/win1.png","game-art/win2.png","game-art/win3.png","game-art/win4.png","game-art/win5.png"];
var WINCAP=["CHAPTER I  -  FREE UP LEWIS","CHAPTER II  -  SAVE DI FEAST","CHAPTER III  -  DALARWEN WOOD","CHAPTER IV  -  THE SPLIT","CHAPTER V  -  ENTER DI VOID"];
var winArt=WINSRC.map(function(s){ var im=new Image(); im.src=s; return im; });
var winIdx=0, winProg=0, winDone=false;
function startWin(){ winIdx=0; winProg=0; winDone=false; startWinMusic(); }
function winAdvance(){
  if(winDone){ startGame(); return; }
  winProg=0;
  if(winIdx<WINSRC.length-1){ winIdx++; beep(880,0.08); beep(1175,0.08); }
  else { winDone=true; beep(1568,0.3); }
}

/* an ORIGINAL uplifting victory chiptune (not derived from any real song) */
var _wm={ctx:null,lead:null,bass:null,lg:null,bg:null,timer:null,step:0,on:false};
var WM_LEAD=[
  523,659,784,880, 784,659,587,0,   587,698,880,784, 659,0,523,0,
  587,740,988,880, 784,659,587,0,   523,659,784,1046, 880,784,659,0
];
var WM_BASS=[131,131,196,196, 174,174,196,196, 131,131,220,220, 174,196,131,0];
function startWinMusic(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    _wm.ctx=_wm.ctx||new AC(); if(_wm.ctx.resume) _wm.ctx.resume();
    _wm.lg=_wm.ctx.createGain(); _wm.lg.gain.value=0.05; _wm.lg.connect(_wm.ctx.destination);
    _wm.lead=_wm.ctx.createOscillator(); _wm.lead.type="square"; _wm.lead.connect(_wm.lg); _wm.lead.start();
    _wm.bg=_wm.ctx.createGain(); _wm.bg.gain.value=0.05; _wm.bg.connect(_wm.ctx.destination);
    _wm.bass=_wm.ctx.createOscillator(); _wm.bass.type="triangle"; _wm.bass.connect(_wm.bg); _wm.bass.start();
    _wm.step=0; _wm.on=true;
    _wm.timer=setInterval(function(){
      var t=_wm.ctx.currentTime, f=WM_LEAD[_wm.step%WM_LEAD.length];
      if(f===0){ _wm.lg.gain.setValueAtTime(0.0001,t); } else { _wm.lg.gain.setValueAtTime(0.05,t); _wm.lead.frequency.setValueAtTime(f,t); }
      if(_wm.step%2===0){ var bf=WM_BASS[(_wm.step/2)%WM_BASS.length]; if(bf===0){_wm.bg.gain.setValueAtTime(0.0001,t);} else {_wm.bg.gain.setValueAtTime(0.05,t); _wm.bass.frequency.setValueAtTime(bf,t);} }
      _wm.step++;
    },180);
  }catch(e){}
}
function stopWinMusic(){
  try{ if(_wm.timer){clearInterval(_wm.timer);_wm.timer=null;}
    if(_wm.lead){_wm.lead.stop();_wm.lead.disconnect();_wm.lead=null;}
    if(_wm.bass){_wm.bass.stop();_wm.bass.disconnect();_wm.bass=null;} }catch(e){}
  _wm.on=false;
}

function buildLevel(){
  seed=1337;
  plats=[]; towers=[]; uploads=[]; sheep=[]; props=[];
  plats.push({x:0,w:380,y:430,cottage:true});
  var x=380, prevY=430;
  while(x<3500){
    var gap=68+rnd()*46; x+=gap;
    var w=200+rnd()*150;
    var y=430, r=rnd();
    if(r<0.28) y=prevY-70-rnd()*30; else if(r<0.42) y=prevY+60;
    y=Math.max(250,Math.min(455,y));
    if(Math.abs(y-prevY)>100) y=prevY-90;
    plats.push({x:x,w:w,y:y}); prevY=y; x+=w;
  }
  plats.push({x:x+90,w:560,y:430,end:true});
  worldW=x+90+560;

  var segs=plats.map(function(p){ return {x0:p.x+18,x1:p.x+p.w-18,y:p.y}; });
  var L=0; segs.forEach(function(s){ L+=Math.max(0,s.x1-s.x0); });
  function atDist(d){ for(var i=0;i<segs.length;i++){ var len=segs[i].x1-segs[i].x0; if(d<=len) return {x:segs[i].x0+d,y:segs[i].y}; d-=len; } var s=segs[segs.length-1]; return {x:s.x1,y:s.y}; }

  for(var i=0;i<15;i++){ var p=atDist((i+0.5)/15*L); towers.push({x:p.x,y:p.y,built:false,blink:rnd()*TAU}); }
  for(var j=0;j<13;j++){ var q=atDist((j+0.35)/13*L); uploads.push({x:q.x+30,y:q.y-46,got:false,bob:rnd()*TAU}); }

  for(var s2=2;s2<plats.length-1;s2++){
    var pl=plats[s2];
    if(pl.w>=230 && rnd()<0.8){
      sheep.push({x:pl.x+40,y:pl.y-30,w:44,h:30,minx:pl.x+16,maxx:pl.x+pl.w-60,dir:rnd()<0.5?-1:1,spd:0.8+rnd()*0.9,t:rnd()*TAU});
    }
  }
  var last=plats[plats.length-1];
  neil={x:last.x+last.w-90,y:last.y-46,w:36,h:46,spd:1.15,active:false,t:0};
  bigTowers=[{x:last.x-30,label:"TOWA 01"},{x:last.x+180,label:"TOWA 02"},{x:last.x+370,label:"TOWA 03"}];

  props.push({type:"sign",x:plats[0].x+40,y:plats[0].y,text:"DALARWEN",arrow:"←"});
  props.push({type:"skeleton",x:plats[0].x+150,y:plats[0].y});
  props.push({type:"graffiti",x:plats[0].x+40,y:plats[0].y+70});
  var midp=plats[Math.floor(plats.length/2)];
  props.push({type:"sign",x:midp.x+midp.w-80,y:midp.y,text:"LOVELY WALKS",arrow:""});
  props.push({type:"sign",x:last.x+last.w-160,y:last.y,text:"FIFTEEN TOWA",arrow:"→"});

  var bi=Math.floor(plats.length*0.45);
  var b0=plats[bi], b1=plats[bi+1]||plats[bi];
  bridge={x0:b0.x+b0.w, x1:b1.x, y:Math.max(b0.y,b1.y)+64};

  streamPts=[]; for(var sp=0;sp<=40;sp++){ streamPts.push({x:sp/40*worldW, y:500+Math.sin(sp*0.6)*14}); }
}

function resetPlayer(px,py){ player={x:px,y:py,w:22,h:34,vx:0,vy:0,onGround:false,face:1,inv:0,run:0,checkX:px,checkY:py}; }

function startGame(){
  stopWinMusic(); winDone=false; winIdx=0; winProg=0;
  buildLevel(); resetPlayer(60,430-34);
  cam=0; hearts=3; builtCount=0; upCount=0; msg=""; msgT=0; frozen=false; respawnT=0;
  rain=[]; for(var i=0;i<150;i++){ rain.push({x:rnd()*(VW+300)-150,y:rnd()*VH,l:16+rnd()*30,s:9+rnd()*10,c:rnd()<0.5?"#7dff9c":"#b57bff"}); }
  state="play";
}

function hurt(){
  if(player.inv>0||frozen) return;
  hearts--; player.inv=90; player.vy=-9; player.vx=player.face*-4; beep(120,0.25,"sawtooth");
  msg="OW! DI SHEEP!"; msgT=70;
  if(hearts<=0){ state="dead"; beep(80,0.5,"sawtooth"); }
}
function loseLifeFall(){
  hearts--; beep(100,0.4,"sawtooth");
  if(hearts<=0){ state="dead"; return; }
  resetPlayer(player.checkX,player.checkY-4); player.inv=120;
  K.left=K.right=K.jump=false;               // clear held input so you can't run straight off again
  frozen=true; respawnT=150; msg="";
}

/* ---------- update ---------- */
function step(){
  tGlobal++;
  if(state!=="play") return;
  for(var r=0;r<rain.length;r++){ var d=rain[r]; d.y+=d.s; d.x-=3.0; if(d.y>VH){ d.y=-d.l; d.x=rnd()*(VW+300)-150; } if(d.x<-160) d.x+=VW+320; }
  for(var s=0;s<sheep.length;s++){ var sh=sheep[s]; sh.t+=0.2; if(!frozen){ sh.x+=sh.dir*sh.spd; if(sh.x<sh.minx){sh.x=sh.minx;sh.dir=1;} if(sh.x>sh.maxx){sh.x=sh.maxx;sh.dir=-1;} } }
  if(neil) neil.t+=0.15;

  if(frozen){ respawnT--; if(respawnT<=0){ frozen=false; } if(msgT>0)msgT--; return; }

  var acc=0.7, max=4.3;
  if(K.left){ player.vx-=acc; player.face=-1; }
  if(K.right){ player.vx+=acc; player.face=1; }
  if(!K.left&&!K.right){ player.vx*=0.8; }
  player.vx=Math.max(-max,Math.min(max,player.vx));
  if(Math.abs(player.vx)>0.4 && player.onGround) player.run+=0.3; else player.run=0;
  if(K.jump&&player.onGround){ player.vy=-15; player.onGround=false; beep(660,0.09); }
  player.vy+=G; if(player.vy>18) player.vy=18;

  player.x+=player.vx;
  if(player.x<0) player.x=0;
  if(player.x+player.w>worldW) player.x=worldW-player.w;

  var py0=player.y; player.y+=player.vy; player.onGround=false;
  for(var i=0;i<plats.length;i++){
    var p=plats[i];
    if(player.x+player.w>p.x+4 && player.x<p.x+p.w-4){
      var top=p.y;
      if(py0+player.h<=top+2 && player.y+player.h>=top){
        player.y=top-player.h; player.vy=0; player.onGround=true;
        player.checkX=Math.min(Math.max(player.x,p.x+16),p.x+p.w-40); player.checkY=top-player.h;
      }
    }
  }
  if(player.y>VH+40){ loseLifeFall(); }
  if(player.inv>0) player.inv--;

  cam=Math.max(0,Math.min(worldW-VW, player.x-VW*0.35));

  for(var t=0;t<towers.length;t++){
    var tw=towers[t]; if(tw.built) continue;
    if(player.x+player.w>tw.x-16 && player.x<tw.x+16 && player.y+player.h>tw.y-72 && player.y<tw.y+4){
      tw.built=true; builtCount++; beep(880,0.12); beep(1320,0.12); msg="TOWA "+builtCount+"/15 BUILT!"; msgT=60;
    }
  }
  for(var u=0;u<uploads.length;u++){
    var up=uploads[u]; if(up.got) continue; up.bob+=0.1;
    if(Math.abs((player.x+player.w/2)-up.x)<24 && Math.abs((player.y+player.h/2)-up.y)<30){
      up.got=true; upCount++; beep(1046,0.1); beep(1568,0.12); msg="UPLOAD "+upCount+"/13 SENT!"; msgT=60;
    }
  }
  for(var s3=0;s3<sheep.length;s3++){ var sh2=sheep[s3];
    if(player.x+player.w>sh2.x+6 && player.x<sh2.x+sh2.w-6 && player.y+player.h>sh2.y+4 && player.y<sh2.y+sh2.h) hurt();
  }
  if(neil){
    if(player.x>neil.x-VW*0.6) neil.active=true;
    if(neil.active){ neil.x+=(player.x>neil.x?1:-1)*neil.spd; }
    if(player.x+player.w>neil.x+4 && player.x<neil.x+neil.w-4 && player.y+player.h>neil.y && player.y<neil.y+neil.h) hurt();
  }
  if(builtCount>=15 && upCount>=13 && state==="play"){ state="win"; startWin(); }
  if(msgT>0) msgT--;
}

/* ---------- helpers ---------- */
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function bolt(x1,y1,x2,y2,segs,jit,col,wid){
  ctx.strokeStyle=col; ctx.lineWidth=wid; ctx.beginPath(); ctx.moveTo(x1,y1);
  for(var i=1;i<segs;i++){ var t=i/segs; ctx.lineTo(x1+(x2-x1)*t+(Math.random()-0.5)*jit, y1+(y2-y1)*t+(Math.random()-0.5)*jit); }
  ctx.lineTo(x2,y2); ctx.stroke();
}

/* ---------- background ---------- */
function drawMoon(){
  var mx=150-cam*0.12, my=95;
  var g=ctx.createRadialGradient(mx,my,4,mx,my,60); g.addColorStop(0,"rgba(200,210,235,0.5)"); g.addColorStop(1,"rgba(200,210,235,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,60,0,TAU); ctx.fill();
  ctx.fillStyle="#c9d0e8"; ctx.beginPath(); ctx.arc(mx,my,26,0,TAU); ctx.fill();
  ctx.fillStyle="#b3bad6"; ctx.beginPath(); ctx.arc(mx-8,my-6,5,0,TAU); ctx.arc(mx+7,my+6,7,0,TAU); ctx.arc(mx+4,my-10,3,0,TAU); ctx.fill();
}
function ridge(off,base,peak,col,step,treeCol){
  var p=cam*off; ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-50,VH);
  for(var x=-50;x<=VW+50;x+=step){ var wx=x+p; var y=base-(Math.sin(wx*0.01)*(peak*0.4))-(Math.sin(wx*0.037)*(peak*0.35))-peak*0.4; ctx.lineTo(x,y); }
  ctx.lineTo(VW+50,VH); ctx.closePath(); ctx.fill();
  if(treeCol){ ctx.fillStyle=treeCol; for(var tx=-40;tx<VW+40;tx+=step*0.6){ var wx2=tx+p; var ty=base-(Math.sin(wx2*0.01)*(peak*0.4))-(Math.sin(wx2*0.037)*(peak*0.35))-peak*0.4; ctx.beginPath(); ctx.moveTo(tx-3,ty); ctx.lineTo(tx,ty-8); ctx.lineTo(tx+3,ty); ctx.closePath(); ctx.fill(); } }
}
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#0d0826"); g.addColorStop(0.45,"#0b0620"); g.addColorStop(1,"#070312");
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  drawMoon();
  var cx=560-cam*0.18; ctx.fillStyle="#140d28";
  rect(cx,250,24,40,"#140d28"); rect(cx-4,244,6,8,"#140d28"); rect(cx+10,240,6,12,"#140d28"); rect(cx+22,244,6,8,"#140d28");
  ridge(0.15,300,90,"#150e2c",64,"#0e0920");
  ridge(0.28,350,70,"#1c1338",56,"#140d2a");
  ridge(0.44,405,55,"#241847",48,null);
  ctx.fillStyle="rgba(120,190,130,0.55)"; ctx.textAlign="center"; ctx.font="bold 26px monospace"; ctx.fillText("DALARWEN",480-cam*0.3,150);
  ctx.lineWidth=2;
  for(var r=0;r<rain.length;r++){ var d=rain[r]; ctx.strokeStyle=d.c; ctx.globalAlpha=0.55; ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-6,d.y+d.l); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(90,220,150,0.25)"; ctx.lineWidth=6; ctx.beginPath();
  for(var sp=0;sp<streamPts.length;sp++){ var px=streamPts[sp].x-cam*0.6, py=streamPts[sp].y; if(sp===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.stroke();
  ctx.strokeStyle="rgba(160,120,255,0.35)"; ctx.lineWidth=2; ctx.stroke();
}

/* ---------- towers ---------- */
function drawBigTower(x,label){
  x-=cam; if(x<-120||x>VW+140) return;
  var baseY=440, topY=180, w=34;
  ctx.strokeStyle="rgba(150,150,170,0.4)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,topY+10); ctx.lineTo(x-46,baseY); ctx.moveTo(x,topY+10); ctx.lineTo(x+46,baseY); ctx.stroke();
  ctx.strokeStyle="#9a9aa6"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x-w/2,baseY); ctx.lineTo(x-6,topY); ctx.moveTo(x+w/2,baseY); ctx.lineTo(x+6,topY); ctx.stroke();
  ctx.strokeStyle="#7a7a86"; ctx.lineWidth=2;

/* ---------- loop ---------- */
var acc=0, last=performance.now();
function frame(now){
  var dt=now-last; last=now; acc+=dt; var steps=0;
  while(acc>=1000/60 && steps<5){ step(); acc-=1000/60; steps++; }
  if(state==="title"){ drawTitle(); }
  else { drawScene();
    if(state==="dead") overlay("GAME OVER",["the sheep (and Neil) send their regards","press R or tap to try again"],"#ff3b5b");
    if(state==="win") drawWin();
  }
  requestAnimationFrame(frame);
}
